services:
  # API FastAPI que coordina Ollama, el procesamiento documental y Qdrant.
  fastapi:
    build:
      context: .
    container_name: parking-ai-fastapi
    # .env contiene la configuración local y no se versiona.
    env_file:
      - .env
    # El manual se monta como solo lectura para poder actualizarlo sin reconstruir.
    volumes:
      - ./documents:/app/documents:ro
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # La API espera a que Qdrant esté saludable antes de iniciar.
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base vectorial persistente para embeddings y metadatos de los chunks.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: parking-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    # El volumen conserva la colección aunque se recree el contenedor.
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'all shards are ready' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage:
